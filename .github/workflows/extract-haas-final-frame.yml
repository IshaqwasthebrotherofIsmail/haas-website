name: Extract HAAS completion final frame
on:
  push:
    paths:
      - '.github/workflows/extract-haas-final-frame.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Extract actual final GIF frame
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Path('assets/membership-complete.gif')
          im=Image.open(source)
          im.seek(im.n_frames-1)
          im.convert('RGBA').save('assets/membership-complete-final.png')
          print(f'Extracted frame {im.n_frames} of {im.n_frames}')
          PY
      - name: Commit extracted still image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/membership-complete-final.png
          git diff --cached --quiet || (git commit -m "Add exact last frame of HAAS completion GIF" && git push)

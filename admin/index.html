<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAA(S) Visual Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;font:14px Arial}.top{height:64px;background:#0b0c0d;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:20}.top img{width:42px;height:42px}.top b{letter-spacing:.1em}.spacer{flex:1}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800}.previewBtn{background:#292929;color:#fff}.publish{background:#fff;color:#53265b}.wrap{padding:14px}.hint{text-align:center;margin:0 auto 12px;background:#fff;padding:10px;border-radius:10px;max-width:1000px}.frame{max-width:1100px;margin:auto;background:#fff;box-shadow:0 8px 30px #0002;border-radius:12px;overflow:hidden}.frame iframe{width:100%;height:calc(100vh - 120px);border:0;display:block}.keybox{position:fixed;right:18px;bottom:18px;z-index:30;background:#fff;padding:10px;border-radius:12px;box-shadow:0 5px 25px #0003;display:flex;gap:7px}.keybox input{border:1px solid #ccc;border-radius:8px;padding:10px}@media(max-width:700px){.top span{display:none}.wrap{padding:7px}.hint{font-size:12px}.frame iframe{height:calc(100vh - 115px)}.keybox{left:7px;right:7px;bottom:7px}.keybox input{flex:1;min-width:0}}.boxbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:40;background:#fff;padding:10px;border-radius:14px;box-shadow:0 5px 25px #0004;display:none;gap:7px;align-items:center;max-width:96vw}.boxbar input[type=color]{width:42px;height:38px;border:0;background:none}.boxbar label{font-size:11px;font-weight:bold}.boxbar input[type=range]{width:90px}.boxbar button{border:0;border-radius:8px;padding:9px;font-weight:bold}.boxbar .close{background:#eee}@media(max-width:700px){.boxbar{bottom:70px;flex-wrap:wrap;justify-content:center}}</style></head><body><header class="top"><img src="../assets/haas-symbol.png"><b>HAA(S)</b><span>Visual Editor</span><div class="spacer"></div><button class="btn previewBtn" onclick="mode()">📱 Preview</button><button class="btn publish" onclick="pub()">Publish</button></header><div class="wrap"><div class="hint">✎ <b>Tap any highlighted text and type.</b> Tap text to edit it, tap images to replace them, or use 🎨 Edit section to change a box colour/background. Press Publish when you're happy.</div><div class="frame"><iframe id="site" src="../index.html"></iframe></div></div><div class="keybox"><input id="key" type="password" placeholder="Admin publish key"><button class="btn publish" onclick="pub()">Publish</button></div><div id="boxbar" class="boxbar"><label>Box colour <input id="boxColor" type="color"></label><label>Text <input id="textColor" type="color"></label><button onclick="bgPicker.click()">🖼 Background image</button><label>Darken <input id="overlay" type="range" min="0" max=".8" step=".1" value="0"></label><button onclick="clearBg()">No image</button><button class="close" onclick="boxbar.style.display='none'">Done</button></div><input id="picker" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="bgPicker" type="file" accept="image/jpeg,image/png,image/webp" hidden><script>
const frame=document.getElementById('site'),picker=document.getElementById('picker'),bgPicker=document.getElementById('bgPicker'),boxbar=document.getElementById('boxbar'),texts={},images={},boxes={};let target=null,activeBox=null,mob=false;
function mode(){mob=!mob;frame.style.width=mob?'390px':'100%';frame.style.margin='auto'}
frame.onload=()=>{const d=frame.contentDocument,st=d.createElement('style');st.textContent='[data-edit]{outline:2px dashed transparent;outline-offset:4px;cursor:text}[data-edit]:hover,[data-edit]:focus{outline-color:#b88bc2;background:rgba(83,38,91,.13)}[data-image]{cursor:pointer;outline:3px solid transparent;outline-offset:-3px}[data-image]:hover{outline-color:#b88bc2}';d.head.appendChild(st);d.querySelectorAll('[data-edit]').forEach(el=>{el.contentEditable='true';el.onclick=e=>e.stopPropagation();el.oninput=()=>texts[el.dataset.edit]=el.innerText});d.querySelectorAll('[data-image]').forEach(el=>{el.onclick=e=>{e.preventDefault();e.stopPropagation();target=el;picker.click()};const host=el.parentElement;if(host&&getComputedStyle(host).position==='static')host.style.position='relative';const b=d.createElement('button');b.textContent='✎';b.title='Change image';b.style.cssText='position:absolute;z-index:99;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:#53265b;font-weight:900;box-shadow:0 2px 10px #0005;cursor:pointer';b.onclick=e=>{e.preventDefault();e.stopPropagation();target=el;picker.click()};host&&host.appendChild(b)});d.querySelectorAll('[data-box]').forEach(el=>{el.style.position=el.style.position||'relative';const b=d.createElement('button');b.textContent='🎨 Edit section';b.style.cssText='position:absolute;z-index:98;top:8px;left:8px;border:0;border-radius:999px;padding:8px 10px;background:#fff;color:#53265b;font-weight:800;box-shadow:0 2px 10px #0004';b.onclick=e=>{e.preventDefault();e.stopPropagation();activeBox=el;boxbar.style.display='flex'};el.appendChild(b)});d.querySelectorAll('a[data-edit]').forEach(a=>a.onclick=e=>e.preventDefault())};
document.getElementById('boxColor').oninput=e=>{if(!activeBox)return;activeBox.style.backgroundColor=e.target.value;(boxes[activeBox.dataset.box]??={}).color=e.target.value};
document.getElementById('textColor').oninput=e=>{if(!activeBox)return;activeBox.style.color=e.target.value;(boxes[activeBox.dataset.box]??={}).textColor=e.target.value};
document.getElementById('overlay').oninput=e=>{if(!activeBox)return;(boxes[activeBox.dataset.box]??={}).overlay=e.target.value;applyBoxBg()};
function applyBoxBg(){const o=boxes[activeBox.dataset.box]||{};if(o.preview)activeBox.style.backgroundImage='linear-gradient(rgba(0,0,0,'+(o.overlay||0)+'),rgba(0,0,0,'+(o.overlay||0)+')),url('+o.preview+')'}
function clearBg(){if(!activeBox)return;activeBox.style.backgroundImage='none';const o=boxes[activeBox.dataset.box]??={};delete o.bgImage;delete o.preview}
bgPicker.onchange=()=>{const f=bgPicker.files[0];if(!f||!activeBox)return;if(f.size>5*1024*1024){alert('Please choose an image under 5 MB.');return}const r=new FileReader(),key=activeBox.dataset.box;r.onload=()=>{const o=boxes[key]??={};o.bgImage=r.result;o.preview=r.result;applyBoxBg()};r.readAsDataURL(f);bgPicker.value=''};
picker.onchange=()=>{const f=picker.files[0];if(!f||!target)return;if(f.size>5*1024*1024){alert('Please choose an image under 5 MB.');return}const r=new FileReader();r.onload=()=>{target.src=r.result;images[target.dataset.image]=r.result};r.readAsDataURL(f);picker.value=''};
async function pub(){const key=document.getElementById('key').value;if(!key)return alert('Enter your admin publish key.');const bs=document.querySelectorAll('.publish');bs.forEach(b=>{b.disabled=true;b.textContent='Publishing…'});try{const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({texts,images,boxes})}),j=await r.json();if(!r.ok)throw Error(j.error||'Publish failed');alert('Published. Vercel is deploying your changes now.')}catch(e){alert(e.message)}finally{bs.forEach(b=>{b.disabled=false;b.textContent='Publish'})}}</script></body></html>

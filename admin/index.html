<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAA(S) Visual Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;font:14px Arial}.top{height:64px;background:#0b0c0d;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:20}.top img{width:42px;height:42px}.top b{letter-spacing:.1em}.spacer{flex:1}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800}.previewBtn{background:#292929;color:#fff}.publish{background:#fff;color:#53265b}.wrap{padding:14px}.hint{text-align:center;margin:0 auto 12px;background:#fff;padding:10px;border-radius:10px;max-width:1000px}.frame{max-width:1100px;margin:auto;background:#fff;box-shadow:0 8px 30px #0002;border-radius:12px;overflow:hidden}.frame iframe{width:100%;height:calc(100vh - 120px);border:0;display:block}.keybox{position:fixed;right:18px;bottom:18px;z-index:30;background:#fff;padding:10px;border-radius:12px;box-shadow:0 5px 25px #0003;display:flex;gap:7px}.keybox input{border:1px solid #ccc;border-radius:8px;padding:10px}@media(max-width:700px){.top span{display:none}.wrap{padding:7px}.hint{font-size:12px}.frame iframe{height:calc(100vh - 115px)}.keybox{left:7px;right:7px;bottom:7px}.keybox input{flex:1;min-width:0}}</style></head><body><header class="top"><img src="../assets/haas-symbol.png"><b>HAA(S)</b><span>Visual Editor</span><div class="spacer"></div><button class="btn previewBtn" onclick="mode()">📱 Preview</button><button class="btn publish" onclick="pub()">Publish</button></header><div class="wrap"><div class="hint">✎ <b>Tap any highlighted text and type.</b> Tap a photograph to replace it. Press Publish when you're happy.</div><div class="frame"><iframe id="site" src="../index.html"></iframe></div></div><div class="keybox"><input id="key" type="password" placeholder="Admin publish key"><button class="btn publish" onclick="pub()">Publish</button></div><input id="picker" type="file" accept="image/jpeg,image/png,image/webp" hidden><script>
const frame=document.getElementById('site'),picker=document.getElementById('picker'),texts={},images={};let target=null,mob=false;
function mode(){mob=!mob;frame.style.width=mob?'390px':'100%';frame.style.margin='auto'}
frame.onload=()=>{const d=frame.contentDocument,st=d.createElement('style');st.textContent='[data-edit]{outline:2px dashed transparent;outline-offset:4px;cursor:text}[data-edit]:hover,[data-edit]:focus{outline-color:#b88bc2;background:rgba(83,38,91,.13)}[data-image]{cursor:pointer;outline:3px solid transparent;outline-offset:-3px}[data-image]:hover{outline-color:#b88bc2}';d.head.appendChild(st);d.querySelectorAll('[data-edit]').forEach(el=>{el.contentEditable='true';el.onclick=e=>e.stopPropagation();el.oninput=()=>texts[el.dataset.edit]=el.innerText});d.querySelectorAll('[data-image]').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();target=el;picker.click()});d.querySelectorAll('a[data-edit]').forEach(a=>a.onclick=e=>e.preventDefault())};
picker.onchange=()=>{const f=picker.files[0];if(!f||!target)return;if(f.size>5*1024*1024){alert('Please choose an image under 5 MB.');return}const r=new FileReader();r.onload=()=>{target.src=r.result;images[target.dataset.image]=r.result};r.readAsDataURL(f);picker.value=''};
async function pub(){const key=document.getElementById('key').value;if(!key)return alert('Enter your admin publish key.');const bs=document.querySelectorAll('.publish');bs.forEach(b=>{b.disabled=true;b.textContent='Publishing…'});try{const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({texts,images})}),j=await r.json();if(!r.ok)throw Error(j.error||'Publish failed');alert('Published. Vercel is deploying your changes now.')}catch(e){alert(e.message)}finally{bs.forEach(b=>{b.disabled=false;b.textContent='Publish'})}}</script></body></html>

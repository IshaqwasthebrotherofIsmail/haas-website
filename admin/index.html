<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAA(S) Visual Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;font:14px Arial}.top{height:64px;background:#0b0c0d;color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:20}.top img{width:42px;height:42px}.top b{letter-spacing:.1em}.spacer{flex:1}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800}.previewBtn{background:#292929;color:#fff}.publish{background:#fff;color:#53265b}.wrap{padding:14px}.hint{text-align:center;margin:0 auto 12px;background:#fff;padding:10px;border-radius:10px;max-width:1000px}.frame{max-width:1100px;margin:auto;background:#fff;box-shadow:0 8px 30px #0002;border-radius:12px;overflow:hidden}.frame iframe{width:100%;height:calc(100vh - 120px);border:0;display:block}.keybox{position:fixed;right:18px;bottom:18px;z-index:30;background:#fff;padding:10px;border-radius:12px;box-shadow:0 5px 25px #0003;display:flex;gap:7px}.keybox input{border:1px solid #ccc;border-radius:8px;padding:10px}@media(max-width:700px){.top span{display:none}.wrap{padding:7px}.hint{font-size:12px}.frame iframe{height:calc(100vh - 115px)}.keybox{left:7px;right:7px;bottom:7px}.keybox input{flex:1;min-width:0}}.boxbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:40;background:#fff;padding:10px;border-radius:14px;box-shadow:0 5px 25px #0004;display:none;gap:7px;align-items:center;max-width:96vw}.boxbar input[type=color]{width:42px;height:38px;border:0;background:none}.boxbar label{font-size:11px;font-weight:bold}.boxbar input[type=range]{width:90px}.boxbar button{border:0;border-radius:8px;padding:9px;font-weight:bold}.boxbar .close{background:#eee}@media(max-width:700px){.boxbar{bottom:70px;flex-wrap:wrap;justify-content:center}}.imagebar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:45;background:#fff;padding:10px 12px;border-radius:14px;box-shadow:0 5px 25px #0004;display:none;gap:9px;align-items:center;max-width:97vw}.imagebar label{font-size:11px;font-weight:bold}.imagebar select,.imagebar input{height:34px}.imagebar input[type=range]{width:95px}.imagebar button{border:0;border-radius:8px;padding:9px;font-weight:bold}@media(max-width:700px){.imagebar{bottom:70px;flex-wrap:wrap;justify-content:center;font-size:11px}}.bgedit{position:absolute;z-index:120;top:8px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;padding:8px 12px;background:#fff;color:#53265b;font-weight:800;box-shadow:0 2px 12px #0005}.bgbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;background:#fff;padding:10px 12px;border-radius:14px;box-shadow:0 5px 25px #0004;display:none;gap:9px;align-items:center;max-width:97vw}.bgbar label{font-size:11px;font-weight:bold}.bgbar input[type=range]{width:100px}.bgbar button{border:0;border-radius:8px;padding:9px;font-weight:bold}@media(max-width:700px){.bgbar{bottom:70px;flex-wrap:wrap;justify-content:center}}</style></head><body><header class="top"><img src="../assets/haas-symbol.png"><b>HAA(S)</b><span>Visual Editor</span><div class="spacer"></div><button class="btn previewBtn" onclick="mode()">📱 Preview</button><button class="btn publish" onclick="pub()">Publish</button></header><div class="wrap"><div class="hint">✎ <b>Tap any highlighted text and type.</b> Tap text to type. Tap images to resize/crop. Every section and card has 🎨 Edit section: choose solid colour or image, then adjust fit, position and darkness. Press Publish when you're happy.</div><div class="frame"><iframe id="site" src="../index.html"></iframe></div></div><div class="keybox"><input id="key" type="password" placeholder="Admin publish key"><button class="btn publish" onclick="pub()">Publish</button></div><div id="bgbar" class="bgbar"><button onclick="bgHeaderPicker.click()">↻ Replace header background</button><label>Position X <input id="bgX" type="range" min="0" max="100" value="50"></label><label>Y <input id="bgY" type="range" min="0" max="100" value="50"></label><button onclick="bgbar.style.display='none'">Done</button></div><div id="imagebar" class="imagebar"><button onclick="picker.click()">↻ Replace</button><label>Fit <select id="imgFit"><option value="cover">Fill</option><option value="contain">Fit</option></select></label><label>Position X <input id="imgX" type="range" min="0" max="100" value="50"></label><label>Y <input id="imgY" type="range" min="0" max="100" value="50"></label><label>Width <input id="imgW" type="range" min="20" max="200" value="100"></label><label>Height <input id="imgH" type="range" min="80" max="900" value="310"></label><label>Zoom <input id="imgZoom" type="range" min="100" max="250" value="100"></label><label>Round <input id="imgR" type="range" min="0" max="80" value="0"></label><button onclick="resetImg()">Reset</button><button onclick="imagebar.style.display='none'">Done</button></div><div id="boxbar" class="boxbar"><label>Box colour <input id="boxColor" type="color"></label><label>Text <input id="textColor" type="color"></label><button onclick="bgPicker.click()">🖼 Background image</button><label>Image <select id="boxSize"><option value="cover">Fill</option><option value="contain">Fit</option></select></label><label>Size <input id="boxZoom" type="range" min="25" max="300" value="100"></label><label>X <input id="boxX" type="range" min="0" max="100" value="50"></label><label>Y <input id="boxY" type="range" min="0" max="100" value="50"></label><label>Darken ↔ Lighten <input id="overlay" type="range" min="-.8" max=".8" step=".05" value="0"></label><button onclick="clearBg()">No image</button><button class="close" onclick="boxbar.style.display='none'">Done</button></div><input id="bgHeaderPicker" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="picker" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="bgPicker" type="file" accept="image/jpeg,image/png,image/webp" hidden><script>
const frame=document.getElementById('site'),picker=document.getElementById('picker'),bgPicker=document.getElementById('bgPicker'),boxbar=document.getElementById('boxbar'),imagebar=document.getElementById('imagebar'),texts={},images={},boxes={},imageStyles={},backgrounds={};let target=null,activeBox=null,activeBg=null,mob=false;
function mode(){mob=!mob;frame.style.width=mob?'390px':'100%';frame.style.margin='auto'}
frame.onload=()=>{const d=frame.contentDocument,st=d.createElement('style');st.textContent='[data-edit]{outline:2px dashed transparent;outline-offset:4px;cursor:text}[data-edit]:hover,[data-edit]:focus{outline-color:#b88bc2;background:rgba(83,38,91,.13)}[data-image]{cursor:pointer;outline:3px solid transparent;outline-offset:-3px}[data-image]:hover{outline-color:#b88bc2}';d.head.appendChild(st);d.querySelectorAll('[data-bg]').forEach(el=>{if(getComputedStyle(el).position==='static')el.style.position='relative';const b=d.createElement('button');b.className='bgedit';b.textContent='🖼 Edit header background';b.onclick=e=>{e.preventDefault();e.stopPropagation();activeBg=el;bgbar.style.display='flex';imagebar.style.display='none';boxbar.style.display='none'};el.appendChild(b)});
d.querySelectorAll('[data-edit]').forEach(el=>{el.contentEditable='true';el.onclick=e=>e.stopPropagation();el.oninput=()=>texts[el.dataset.edit]=el.innerText});d.querySelectorAll('[data-image]').forEach(el=>{el.onclick=e=>{e.preventDefault();e.stopPropagation();target=el;openImageTools(el)};const host=el.parentElement;if(host&&getComputedStyle(host).position==='static')host.style.position='relative';const b=d.createElement('button');b.textContent='✎';b.title='Change image';b.style.cssText='position:absolute;z-index:99;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:#53265b;font-weight:900;box-shadow:0 2px 10px #0005;cursor:pointer';b.onclick=e=>{e.preventDefault();e.stopPropagation();target=el;openImageTools(el)};host&&host.appendChild(b)});d.querySelectorAll('[data-box]').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('[data-edit],[data-image],a,button'))return;e.preventDefault();e.stopPropagation();activeBox=el;const o=boxes[el.dataset.box]||{};boxSize.value=o.fit||o.size||'cover';boxZoom.value=o.zoom??100;boxX.value=o.x??50;boxY.value=o.y??50;overlay.value=o.overlay??0;boxbar.style.display='flex';imagebar.style.display='none';bgbar.style.display='none'})});d.querySelectorAll('a[data-edit]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()}))};
function openImageTools(el){target=el;imagebar.style.display='flex';boxbar.style.display='none';const cs=frame.contentWindow.getComputedStyle(el);imgFit.value=cs.objectFit==='contain'?'contain':'cover';imgW.value=Math.max(20,Math.min(200,parseFloat(el.style.width)||100));imgH.value=Math.max(80,Math.min(900,el.getBoundingClientRect().height));imgZoom.value=parseInt((imageStyles[el.dataset.image]||{}).zoom)||Math.round((parseFloat(el.style.transform.match(/scale\(([^)]+)\)/)?.[1])||1)*100);imgR.value=parseInt(cs.borderRadius)||0}
function imgStyle(){if(!target)return null;return imageStyles[target.dataset.image]??={}}
imgFit.onchange=e=>{const o=imgStyle();o.fit=e.target.value;target.style.objectFit=o.fit};
imgX.oninput=e=>{const o=imgStyle();o.x=e.target.value;o.y=imgY.value;target.style.objectPosition=o.x+'% '+o.y+'%'};
imgY.oninput=e=>{const o=imgStyle();o.y=e.target.value;o.x=imgX.value;target.style.objectPosition=o.x+'% '+o.y+'%'};
imgW.oninput=e=>{const o=imgStyle();o.width=e.target.value;target.style.width=o.width+'%'};
imgH.oninput=e=>{const o=imgStyle();o.height=e.target.value;target.style.height=o.height+'px'};
imgZoom.oninput=e=>{const o=imgStyle();o.zoom=e.target.value;target.style.transform='scale('+(o.zoom/100)+')';target.style.transformOrigin='center';target.style.clipPath='inset('+((1-100/Number(o.zoom))*50)+'%)'};
imgR.oninput=e=>{const o=imgStyle();o.radius=e.target.value;target.style.borderRadius=o.radius+'px'};
function resetImg(){if(!target)return;delete imageStyles[target.dataset.image];target.style.objectFit='';target.style.objectPosition='';target.style.width='';target.style.height='';target.style.transform='';target.style.clipPath='';target.style.borderRadius='';openImageTools(target)}
async function compressImage(file,maxDim=1800,quality=.82){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Could not read that image'))};img.src=u})}
bgHeaderPicker.onchange=()=>{const f=bgHeaderPicker.files[0];if(!f||!activeBg)return;const key=activeBg.dataset.bg;compressImage(f).then(data=>{const o=backgrounds[key]??={};o.image=data;o.preview=data;o.x=bgX.value;o.y=bgY.value;activeBg.style.backgroundImage='url('+data+')';activeBg.style.backgroundSize='cover';activeBg.style.backgroundPosition=o.x+'% '+o.y+'%'}).catch(e=>alert(e.message));bgHeaderPicker.value=''};
function bgPos(){if(!activeBg)return;const o=backgrounds[activeBg.dataset.bg]??={};o.x=bgX.value;o.y=bgY.value;activeBg.style.backgroundPosition=o.x+'% '+o.y+'%'}
bgX.oninput=bgPos;bgY.oninput=bgPos;
document.getElementById('boxColor').oninput=e=>{if(!activeBox)return;activeBox.style.backgroundColor=e.target.value;(boxes[activeBox.dataset.box]??={}).color=e.target.value};
document.getElementById('textColor').oninput=e=>{if(!activeBox)return;activeBox.style.color=e.target.value;(boxes[activeBox.dataset.box]??={}).textColor=e.target.value};
document.getElementById('overlay').oninput=e=>{if(!activeBox)return;(boxes[activeBox.dataset.box]??={}).overlay=e.target.value;applyBoxBg()};
boxSize.onchange=e=>{if(!activeBox)return;const o=boxes[activeBox.dataset.box]??={};o.fit=e.target.value;o.size=e.target.value;applyBoxBg()};
boxZoom.oninput=e=>{if(!activeBox)return;(boxes[activeBox.dataset.box]??={}).zoom=e.target.value;applyBoxBg()};
boxX.oninput=e=>{if(!activeBox)return;(boxes[activeBox.dataset.box]??={}).x=e.target.value;applyBoxBg()};
boxY.oninput=e=>{if(!activeBox)return;(boxes[activeBox.dataset.box]??={}).y=e.target.value;applyBoxBg()};
function applyBoxBg(){const o=boxes[activeBox.dataset.box]||{};if(o.preview){activeBox.style.backgroundImage='linear-gradient(rgba('+(Number(o.overlay)<0?'255,255,255,':'0,0,0,')+Math.abs(Number(o.overlay)||0)+'),rgba('+(Number(o.overlay)<0?'255,255,255,':'0,0,0,')+Math.abs(Number(o.overlay)||0)+')),url('+o.preview+')';activeBox.style.backgroundSize=(o.zoom&&Number(o.zoom)!==100)?o.zoom+'% auto':(o.fit||o.size||'cover');activeBox.style.backgroundPosition=(o.x??50)+'% '+(o.y??50)+'%';activeBox.style.backgroundRepeat='no-repeat'}}
function clearBg(){if(!activeBox)return;activeBox.style.backgroundImage='none';const o=boxes[activeBox.dataset.box]??={};o.removeBg=true;delete o.bgImage;delete o.preview;delete o.bgPath;activeBox.style.backgroundSize='';activeBox.style.backgroundPosition=''}
bgPicker.onchange=()=>{const f=bgPicker.files[0];if(!f||!activeBox)return;const key=activeBox.dataset.box;compressImage(f).then(data=>{const o=boxes[key]??={};o.removeBg=false;o.bgImage=data;o.preview=data;applyBoxBg()}).catch(e=>alert(e.message));bgPicker.value=''};
picker.onchange=()=>{const f=picker.files[0];if(!f||!target)return;compressImage(f).then(data=>{target.src=data;images[target.dataset.image]=data}).catch(e=>alert(e.message));picker.value=''};
async function pub(){const key=document.getElementById('key').value;if(!key)return alert('Enter your admin publish key.');const bs=document.querySelectorAll('.publish');bs.forEach(b=>{b.disabled=true;b.textContent='Publishing…'});try{const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({texts,images,boxes,imageStyles,backgrounds})}),raw=await r.text(),j=(()=>{try{return JSON.parse(raw)}catch{return {error:r.status===413?'Upload too large for server':('Server error ('+r.status+'): '+raw.slice(0,140))}}})();if(!r.ok)throw Error(j.error||'Publish failed');alert('Published. Vercel is deploying your changes now.')}catch(e){alert(e.message)}finally{bs.forEach(b=>{b.disabled=false;b.textContent='Publish'})}}</script></body></html>
